# =============================================================================
# Zone Controller - example Home Assistant package
# =============================================================================
# This package creates the helper entities the Zone Controller blueprints need:
# per-room setpoints (input_number), per-room enable toggles (input_boolean),
# demand + bookkeeping helpers, and a wide (~5 mi) presence zone.
#
# It deliberately does NOT create the sleep-mode or home-occupied booleans -
# most setups already have those. Point the blueprint inputs at your existing
# ones (see the prerequisites list below).
#
# To use it:
#   1. Ensure packages are enabled in configuration.yaml, e.g.:
#          homeassistant:
#            packages: !include_dir_named packages
#      then place this file at   <config>/packages/zone_controller.yaml
#   2. Replace every `# TODO` below with your real entity IDs / coordinates.
#   3. Restart Home Assistant (or reload the relevant helpers).
#
# Temperature values assume °F. Adjust to your unit system if needed.
#
# Damper reminder: the damper switches are INVERTED / normally-open
# (off = OPEN, on = CLOSED). The blueprints handle that - you only need to
# point them at the correct switch entities.
#
# TODO entities you must already have (created by ESPHome / your integrations):
#   - Room temperature sensors:
#       sensor.nursery_temperature
#       sensor.server_room_temperature
#       sensor.master_bedroom_temperature
#       sensor.theater_temperature
#   - Master bedroom occupancy:
#       binary_sensor.master_bedroom_occupancy
#   - Damper switches (off = open, on = closed):
#       switch.damper_nursery
#       switch.damper_server_room
#       switch.damper_master_bedroom_1
#       switch.damper_master_bedroom_2
#       switch.damper_theater          (guest room + relief valve)
#   - Main upstairs unit:
#       climate.upstairs_hvac
#   - Your existing toggles (this package does NOT create these):
#       input_boolean.<your_sleep_mode>       (master sleep / pre-cool override)
#       input_boolean.<your_home_occupied>    (home/away toggle)
#       input_select.<your_house_mode>        (optional: Home / Away / Vacation -
#                                              Away => eco preset, Vacation => off)
# =============================================================================

input_number:
  nursery_heat_sp:
    name: Nursery heat setpoint
    min: 60
    max: 78
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:fire
    initial: 68

  nursery_cool_sp:
    name: Nursery cool setpoint
    min: 65
    max: 85
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:snowflake
    initial: 70

  server_cool_sp:
    name: Server room cool setpoint
    min: 65
    max: 90
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:server
    initial: 75

  master_cool_sp:
    name: Master bedroom cool setpoint (day)
    min: 65
    max: 85
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:bed
    initial: 74

  master_sleep_cool_sp:
    name: Master bedroom cool setpoint (sleep)
    min: 60
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:bed-clock
    initial: 68

  master_away_cool_sp:
    name: Master bedroom cool setpoint (away)
    min: 68
    max: 82
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:bed-outline
    initial: 75

  # Theater / bonus room setpoints, used by the theater Room Zone while guest-room
  # mode is on (the sleep one also drives its 20:00 pre-cool and its boost).
  theater_cool_sp:
    name: Theater cool setpoint (day)
    min: 65
    max: 85
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:bed-king
    initial: 74

  theater_sleep_cool_sp:
    name: Theater cool setpoint (sleep)
    min: 60
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:bed-clock
    initial: 69

  # Bookkeeping for the coordinator's setpoint force-run (last value it wrote).
  zc_last_cmd_setpoint:
    name: Last commanded HVAC setpoint
    min: 40
    max: 95
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermostat

input_boolean:
  # Per-room enable/disable. Off = room publishes no demand, damper closed.
  nursery_enabled:
    name: Nursery enabled
    icon: mdi:baby-carriage

  server_enabled:
    name: Server room enabled
    icon: mdi:server

  master_enabled:
    name: Master bedroom enabled
    icon: mdi:bed

  # Theater guest-room mode: the theater Room Zone's Enable toggle. While on, the
  # theater is conditioned like a bedroom (setpoints, 20:00 pre-cool, boost);
  # while off it only opens as the pressure-relief valve.
  theater_guest_mode:
    name: Theater guest room mode
    icon: mdi:bed

  # Theater comfort boost: while on, the theater temporarily uses its sleep cool
  # setpoint. Point the theater Room Zone's "Comfort boost toggle" at this.
  # (Like every theater setpoint, it only takes effect while guest mode is on.)
  theater_boost:
    name: Theater comfort boost
    icon: mdi:snowflake-thermometer

  # Master comfort boost: while on, the master bedroom temporarily uses its sleep
  # (night) cool setpoint and stays eligible during the day - e.g. someone is
  # using the room. Point the master Room Zone's "Comfort boost toggle" at this.
  master_boost:
    name: Master bedroom comfort boost
    icon: mdi:snowflake-thermometer

  # NOTE: sleep-mode and home-occupied booleans are intentionally NOT created
  # here - point the blueprints at your existing ones.

  # Manual setpoint override for the coordinator's force-run feature (setpoint only).
  zc_setpoint_manual:
    name: HVAC setpoint manual override
    icon: mdi:hand-back-right

  # Full manual override / bypass: while on, the coordinator AND every room stand
  # down completely (no mode, on/off, setpoint, or dampers) for full manual control.
  zc_bypass:
    name: HVAC full manual override (bypass)
    icon: mdi:hand-back-right-off

  # Cooling-relief-needed flag: the coordinator turns this ON while cooling with
  # fewer than the minimum rooms calling, so a relief room (e.g. the server) rides
  # along ONLY when it's actually needed. Point the coordinator's "Cooling-relief-
  # needed output" and the server's "Ride along only while this is on" at this.
  zc_cool_relief:
    name: HVAC cooling relief needed
    icon: mdi:air-filter

  # Theater relief flag: the coordinator turns this ON whenever the theater must
  # open as the last-resort pressure-relief valve. Point the coordinator's
  # "Theater relief output" and the theater Room Zone's "Force open while this
  # is on" at this.
  zc_theater_relief:
    name: HVAC theater relief valve open
    icon: mdi:valve-open

# Per-room raw demand (heat / cool / none), written by the Room Zone blueprint
# and read by the Coordinator in priority order.
input_text:
  nursery_demand:
    name: Nursery demand
    initial: none
    icon: mdi:baby-carriage

  master_demand:
    name: Master bedroom demand
    initial: none
    icon: mdi:bed

  server_demand:
    name: Server room demand
    initial: none
    icon: mdi:server

  # Nursery "urgent" demand - set when the nursery is far past its setpoint. Point
  # the master's Priority Yield at this so it only yields in extreme cases.
  nursery_urgent:
    name: Nursery urgent demand
    initial: none
    icon: mdi:baby-carriage-off

  # Theater demand (guest-room mode). Written by the theater Room Zone; add it LAST
  # in the coordinator's demand list so the guest room is the lowest priority.
  theater_demand:
    name: Theater demand
    initial: none
    icon: mdi:bed-king

  # Per-room plain-English status (why each room is / isn't calling). Diagnostic.
  nursery_status:
    name: Nursery status
    max: 255
    icon: mdi:baby-carriage
  master_status:
    name: Master bedroom status
    max: 255
    icon: mdi:bed
  server_status:
    name: Server room status
    max: 255
    icon: mdi:server
  theater_status:
    name: Theater status
    max: 255
    icon: mdi:bed

  # Coordinator writes a one-line summary of each decision here (diagnostic).
  zc_status:
    name: Zone controller status
    max: 255
    icon: mdi:message-text-outline

# Remembers when the unit last changed direction (compressor anti-short-cycle).
input_datetime:
  zc_last_changeover:
    name: Last HVAC changeover
    has_date: true
    has_time: true
    icon: mdi:swap-horizontal

  # When the setpoint manual-edit grace period ends (force-run feature).
  zc_manual_until:
    name: HVAC setpoint manual grace until
    has_date: true
    has_time: true
    icon: mdi:timer-sand

  # Away circulation purge: stores when the current fan-only purge window ends.
  # Point the Coordinator's "Purge-window helper" AND every Room Zone's
  # "Circulation purge window" at this same helper.
  zc_purge_until:
    name: HVAC circulation purge until
    has_date: true
    has_time: true
    icon: mdi:fan-clock

# A wide (~5 mi) zone. Anyone inside it counts as home/approaching.
# 5 miles ~= 8047 meters.  # TODO: set latitude/longitude to your home.
zone:
  - name: Home Wide
    latitude: !secret homeassistant_latitude
    longitude: !secret homeassistant_longitude
    radius: 8047
    icon: mdi:map-marker-radius
    passive: true
