# =============================================================================
# Zone Controller - example Home Assistant package
# =============================================================================
# This package creates the helper entities the Zone Controller blueprints need:
# per-room setpoints (input_number), per-room enable toggles (input_boolean),
# demand + bookkeeping helpers, and a wide (~5 mi) presence zone.
#
# It deliberately does NOT create the sleep-mode or home-occupied booleans -
# most setups already have those. Point the blueprint inputs at your existing
# ones (see the prerequisites list below).
#
# To use it:
#   1. Ensure packages are enabled in configuration.yaml, e.g.:
#          homeassistant:
#            packages: !include_dir_named packages
#      then place this file at   <config>/packages/zone_controller.yaml
#   2. Replace every `# TODO` below with your real entity IDs / coordinates.
#   3. Restart Home Assistant (or reload the relevant helpers).
#
# Temperature values assume °F. Adjust to your unit system if needed.
#
# Damper reminder: the damper switches are INVERTED / normally-open
# (off = OPEN, on = CLOSED). The blueprints handle that - you only need to
# point them at the correct switch entities.
#
# TODO entities you must already have (created by ESPHome / your integrations):
#   - Room temperature sensors:
#       sensor.nursery_temperature
#       sensor.server_room_temperature
#       sensor.master_bedroom_temperature
#   - Master bedroom occupancy:
#       binary_sensor.master_bedroom_occupancy
#   - Damper switches (off = open, on = closed):
#       switch.damper_nursery
#       switch.damper_server_room
#       switch.damper_master_bedroom_1
#       switch.damper_master_bedroom_2
#       switch.damper_theater          (relief valve)
#   - Main upstairs unit:
#       climate.upstairs_hvac
#   - Your existing toggles (this package does NOT create these):
#       input_boolean.<your_sleep_mode>       (master sleep / pre-cool override)
#       input_boolean.<your_home_occupied>    (home/away toggle)
# =============================================================================

input_number:
  nursery_heat_sp:
    name: Nursery heat setpoint
    min: 60
    max: 78
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:fire
    initial: 68

  nursery_cool_sp:
    name: Nursery cool setpoint
    min: 65
    max: 85
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:snowflake
    initial: 71

  server_cool_sp:
    name: Server room cool setpoint
    min: 65
    max: 90
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:server
    initial: 80

  master_cool_sp:
    name: Master bedroom cool setpoint (day)
    min: 65
    max: 85
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:bed
    initial: 75

  master_sleep_cool_sp:
    name: Master bedroom cool setpoint (sleep)
    min: 60
    max: 80
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:bed-clock
    initial: 68

  # Bookkeeping for the coordinator's setpoint force-run (last value it wrote).
  zc_last_cmd_setpoint:
    name: Last commanded HVAC setpoint
    min: 40
    max: 95
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermostat

input_boolean:
  # Per-room enable/disable. Off = room publishes no demand, damper closed.
  nursery_enabled:
    name: Nursery enabled
    icon: mdi:baby-carriage

  server_enabled:
    name: Server room enabled
    icon: mdi:server

  master_enabled:
    name: Master bedroom enabled
    icon: mdi:bed

  # NOTE: sleep-mode and home-occupied booleans are intentionally NOT created
  # here - point the blueprints at your existing ones.

  # Manual setpoint override for the coordinator's force-run feature.
  zc_setpoint_manual:
    name: HVAC setpoint manual override
    icon: mdi:hand-back-right

# Per-room raw demand (heat / cool / none), written by the Room Zone blueprint
# and read by the Coordinator in priority order.
input_text:
  nursery_demand:
    name: Nursery demand
    initial: none
    icon: mdi:baby-carriage

  master_demand:
    name: Master bedroom demand
    initial: none
    icon: mdi:bed

  server_demand:
    name: Server room demand
    initial: none
    icon: mdi:server

# Remembers when the unit last changed direction (compressor anti-short-cycle).
input_datetime:
  zc_last_changeover:
    name: Last HVAC changeover
    has_date: true
    has_time: true
    icon: mdi:swap-horizontal

  # When the setpoint manual-edit grace period ends (force-run feature).
  zc_manual_until:
    name: HVAC setpoint manual grace until
    has_date: true
    has_time: true
    icon: mdi:timer-sand

# A wide (~5 mi) zone. Anyone inside it counts as home/approaching.
# 5 miles ~= 8047 meters.  # TODO: set latitude/longitude to your home.
zone:
  - name: Home Wide
    latitude: 0.0        # TODO
    longitude: 0.0       # TODO
    radius: 8047
    icon: mdi:map-marker-radius
    passive: true
